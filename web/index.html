  <!-- Loading screen — shown instantly while Flutter boots -->
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #07080E; }
    #fl-load {
      position: fixed;
      inset: 0;
      background: #07080E;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      z-index: 9999;
      transition: opacity 0.4s ease;
    }
    #fl-load .monogram {
      color: #ECEAF8;
      font-family: system-ui, sans-serif;
      font-size: 22px;
      font-weight: 700;
      letter-spacing: 4px;
      opacity: 0.9;
    }
    #fl-load .track {
      width: 100px;
      height: 2px;
      background: #17182C;
      border-radius: 2px;
      overflow: hidden;
    }
    #fl-load .fill {
      height: 100%;
      border-radius: 2px;
      background: linear-gradient(90deg, #7B74CC, #00C8DC);
      animation: sweep 1.4s cubic-bezier(0.4, 0, 0.2, 1) infinite;
    }
    @keyframes sweep {
      0%   { transform: translateX(-100%) scaleX(0.4); }
      50%  { transform: translateX(60%)   scaleX(0.7); }
      100% { transform: translateX(200%)  scaleX(0.4); }
    }
  </style>
</head>
<body>
  <div id="fl-load">
    <div class="monogram">OS</div>
    <div class="track"><div class="fill"></div></div>
  </div>

  <script>
    // Fade out the loading screen on Flutter's first rendered frame
    window.addEventListener('flutter-first-frame', function () {
      var el = document.getElementById('fl-load');
      if (el) {
        el.style.opacity = '0';
        setTimeout(function () { el.remove(); }, 420);
      }
    });
  </script>

  <script>
    // Unregister any existing service worker so returning visitors get fresh content
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function(registrations) {
        for (var r of registrations) { r.unregister(); }
      });
    }
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
